<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftCart</title>
  <link rel="website icon" type="svg" href="thumbnail1.svg">
  <link rel="stylesheet" href="libs/style/index.css">
</head>


<body>

  <main>
    <header>
      <div class="left_div">
        <img src="libs/thumbnails/thumbnail1.svg" alt="">

        <div class="left_title_div">
          <p class="title">SwiftCart</p>
          <p class="slogan">Your Perfect Fit Awaits</p>
        </div>
      </div>
  
      <div class="center_div">
      </div>
  
      <div class="right_div">
        <a href="#sec2">
          <button class="feedback_bt" >Feedback</button>
        </a>

        <a href="#footer">
          <button class="customer_bt"> Customer Care</button>
        </a>

        <button class="login_bt">Login</button>
        <button class="sign_bt">Sign up</button>
      </div>
    </header>
  
    <nav>
      <a href="index.html">
         <button class="home_bt">
          HOME
        </button>
      </a>
     
      <a href="product_cars.html">
        <button class="product_bt">
          PRODUCT
        </button>
      </a>
      
      <a href="about_us.html">
        <button class="about_bt">
          ABOUT US
        </button>
      </a>
  
    </nav>
  
    <section id="sec1">
      <div class="sale_div">
        <img src="libs/thumbnails/thumbnail5.jpg" alt="">
      </div>
  
      <div class="product_div">
        <a href="product_cars.html">
          <div class="cars_div">
            <p>Cars</p>
            <img src="libs/thumbnails/thumbnail2.png" alt="">
          </div>
        </a>
        
        <a href="product_cellphones.html">
          <div class="cellphones_div">
            <p>Smartphones</p>
            <img src="libs/thumbnails/thumbnail3.png" alt="">
          </div>
        </a>
  
        <a href="product_shoes.html">
          <div class="shoes_div">
            <p>Shoes</p>
            <img src="libs/thumbnails/thumbnail4.png" alt="">
          </div>
        </a>
        
      </div>
    </section>

    <section id="sec2" class="section2">
      <div class="heading">
        <h1>
          Customer Care
        </h1>
      </div>

      <div class="review_div">
        <div class="review">
          <img  src="libs/thumbnails/rev1.png" alt="">

          <img  src="libs/thumbnails/rev2.png" alt="">

          <img  src="libs/thumbnails/rev3.png" alt="">
        </div>
      </div>

    </section>

    <footer id="footer">
      <img class=" background_footer" src="libs/thumbnails/thumbnail10.png" alt="">
      <div class="contact_div">
        <div class="contact_us">
          <h1>Contact Us</h1>
        </div>

        <div class="con email">
          <img src="libs/icons/mail.png" alt="">
          <p>SwiftCart@gmail.com</p>
        </div>

        <div class="con facebook">
          <img src="libs/icons/communication.png" alt="">
          <p>SwiftCart</p>
        </div>

        <div class="con call">
          <img src="libs/icons/phone-call.png" alt="">
          <p>092834942121</p>
        </div>

        <div class="con address">
          <img src="libs/icons/circle.png" alt="">
          <p>Bacolor, Pampanga</p>
        </div>
      </div>
    </footer>

  </main>
  
</body>
</html>
