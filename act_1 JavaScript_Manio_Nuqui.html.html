<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>ADDITION ACTIVITY</title>

      <style>

        body {
                padding: 20px;
            }
            .inputs{
                margin-bottom: 10px;
            }
            input{
                padding: 8px;
                width: 180px;
            }
            button {
                padding: 8px 16px;
                cursor: pointer;
            }
            .result {
                margin-top: 15px;
                font-size: 18px;
                font-weight: bold;
            }


      </style>

</head>
<body>

    <h2>Add Two Numbers</h2>

    <div class="inputs">
        <label>Number 1:</label><br>
        <input type="text" id="num1"><br>
    </div>

    <div class="inputs">
        <label>Number 2:</label><br>
        <input type="text" id="num2"><br>
    </div>

    <button onclick="addNumbers()">ADD</button>

    <div class="result"> RESULT: <span id="result">0</span> </div>


    <script>
      function addNumbers() {
        let number1 = parseFloat(document.getElementById("num1").value);
        let number2 = parseFloat(document.getElementById("num2").value);
    
        if (isNaN(number1) || isNaN(number2)) {
          alert("Please enter valid numbers only.");
          return;
        }
    
        let sum = number1 + number2;
        document.getElementById("result").textContent = sum;
      }
    </script>
  
</body>
</html>
